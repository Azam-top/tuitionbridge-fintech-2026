const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const usd = (c) => { const v = BigInt(c); const n = v < 0n; const a = n ? -v : v; return `${n ? "-" : ""}USD ${(a/100n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",")}.${(a%100n).toString().padStart(2,"0")}`; };
const kzt = (c) => usd(c).replace("USD", "KZT");
const money = (a) => a.currency === "USD" ? usd(a.balance) : kzt(a.balance);
const kv = (o) => `<div class="kv">${Object.entries(o).map(([k, v]) => `<div>${esc(k)}</div><div>${v}</div>`).join("")}</div>`;
const json = (v) => `<details><summary>Show JSON</summary><pre>${esc(JSON.stringify(v, null, 2))}</pre></details>`;

function ledgerTable(before, after, label) {
  const rows = before.accounts.map((a, i) => { const b = after.accounts[i]; return `<tr><td><code>${esc(a.id)}</code></td><td>${esc(a.kind)}</td><td>${money(a)}</td><td>${money(b)}</td><td>${a.balance === b.balance ? "unchanged" : "<strong>changed</strong>"}</td></tr>`; }).join("");
  return `<h3>${esc(label)}</h3><table><thead><tr><th>Account</th><th>Kind</th><th>Before</th><th>After</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <p>Payments recorded: ${before.paymentCount} → ${after.paymentCount}; ledger entries: ${before.entryCount} → ${after.entryCount}</p>`;
}
function trace(ev) {
  return `<table><thead><tr><th>#</th><th>Kind</th><th>Tool / text</th><th>Result</th></tr></thead><tbody>${ev.map((e) =>
    `<tr><td>${e.seq}</td><td>${esc(e.kind)}</td><td>${e.tool ? `<code>${esc(e.tool)}</code>` : esc(e.text)}</td><td>${e.kind === "tool" ? (e.ok ? '<span class="pass">ok</span>' : '<span class="fail">rejected: ' + esc(e.output?.error?.code) + "</span>") : ""}${e.kind === "tool" ? json({ input: e.input, output: e.output }) : ""}</td></tr>`).join("")}</tbody></table>`;
}
function success() {
  const s = D.success, p = s.proposal.payload, r = s.receipt;
  return `<div class="card"><h2>Successful payment</h2><p>${esc(s.description)}</p>
    ${kv({ "Task state": esc(s.task.state), "Agent mode": esc(s.task.mode) + " (token usage not reported)", "Instruction": esc(s.task.instruction),
      "Tool calls / model requests": `${s.task.usage.toolCalls} / ${s.task.usage.modelRequests}` })}</div>
    <div class="card"><h2>Tool-call trace</h2>${trace(s.toolTrace)}</div>
    <div class="card"><h2>Proposal and human approval</h2>${kv({ "Proposal": `<code>${esc(s.proposal.id)}</code>`, "SHA-256 fingerprint": `<code>${esc(s.proposal.hash)}</code>`,
      "Recipient will receive": kzt(p.recipientTiyn), "Total debit": usd(p.totalDebitCents), "Reserve kept": usd(p.reserveCents),
      "Approval record": s.humanApproval ? `<code>${esc(s.humanApproval.id)}</code> at ${esc(s.humanApproval.approvedAt)} (consumed ${esc(s.humanApproval.consumedAt)})` : "none" })}
      <p class="note">In this export the approval call stands in for the student's click; in the app it is only reachable through the authenticated approval endpoint.</p>${json(s.proposal)}</div>
    <div class="card"><h2>Ledger before / after</h2>${ledgerTable(s.ledger.before, s.ledger.after, "All accounts (USD and KZT are never summed)")}
      <p>At the approval pause, before any money moved: payments = ${s.ledger.atApprovalPause.paymentCount}, entries = ${s.ledger.atApprovalPause.entryCount}.</p>${json(s.ledgerEntries)}</div>
    <div class="card"><h2>Receipt (SIMULATED)</h2><p>${esc(r.disclaimer)}</p>${kv({ "Payment": `<code>${esc(r.paymentId)}</code>`, "Debited": usd(r.totalDebitCents), "Credited to university": kzt(r.recipientTiynCredited), "Rounding surplus": kzt(r.surplusTiyn), "Balance before → after": `${usd(r.usdBalanceBeforeCents)} → ${usd(r.usdBalanceAfterCents)}` })}${json(r)}</div>
    <div class="card"><h2>Audit log (redacted structured fields)</h2>${json(s.audit)}</div>`;
}
function malicious() {
  const m = D.malicious, a = m.mockAgentRun, o = m.scriptedObedientModelRun;
  return `<div class="card"><h2>Rejected malicious invoice</h2><p>${esc(m.description)}</p>
    <h3>Injected invoice text (untrusted)</h3><pre>${esc(m.injectedNotes)}</pre>
    ${kv({ "Payment ledger unchanged": m.paymentLedgerUnchanged ? '<span class="pass">yes</span>' : '<span class="fail">NO</span>', "Beneficiary in proposal": `<code>${esc(a.proposalBeneficiaryAccount)}</code> (trusted registry value)`,
      "Forged execute with an invoice-claimed approval": esc(a.forgedExecuteAttempt.result) })}</div>
    <div class="card"><h2>MOCK agent trace on the malicious invoice</h2>${trace(a.toolTrace)}</div>
    <div class="card"><h2>SCRIPTED model that obeys the injection</h2><p class="note">${esc(o.label)}</p>${trace(o.toolTrace)}<p>Final task state: <strong>${esc(o.task.state)}</strong></p></div>
    <div class="card"><h2>Ledger</h2>${ledgerTable(m.ledger.before, m.ledger.after, "MOCK agent run")}${ledgerTable(m.ledger.before, m.ledger.afterScriptedRun, "Scripted obedient-model run")}</div>`;
}
function evalPanel(rep, title) {
  if (!rep) return `<div class="card"><h2>${esc(title)}</h2><p class="note">Not run. A real-model evaluation needs a configured key and was not performed for this bundle.</p></div>`;
  const cats = Object.entries(rep.byCategory).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.passed}/${v.total}</td></tr>`).join("");
  const rows = rep.cases.map((c) => `<tr><td><code>${esc(c.id)}</code>${c.critical ? " ★" : ""}</td><td>${esc(c.category)}</td><td>${esc(c.title)}</td><td class="${c.passed ? "pass" : "fail"}">${c.passed ? "pass" : "FAIL"}</td></tr>`).join("");
  return `<div class="card"><h2>${esc(title)}</h2><p>${esc(rep.label)}</p>
    ${kv({ "Passed": `<strong>${rep.passed}/${rep.denominator}</strong>`, "Critical gates (★)": `${rep.criticalGates.passed}/${rep.criticalGates.total}`, "Unauthorized successful payments": String(rep.unauthorizedSuccessfulPayments),
      "Failed cases": rep.failed.length ? esc(rep.failed.join(", ")) : "none", "Environment": esc(`${rep.environment.agentMode} agent, Node ${rep.environment.node}, commit ${rep.environment.gitHead}`), "Generated": esc(rep.generatedAt),
      "Usage": esc(rep.usage.note || JSON.stringify(rep.usage)) })}
    <p class="note">Targets (≥27/30, all critical gates, zero unauthorized payments) are project targets, not official judging thresholds.</p>
    <h3>By category</h3><table><tbody>${cats}</tbody></table><h3>Cases</h3><table><thead><tr><th>ID</th><th>Category</th><th>Case</th><th>Result</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function manifestPanel() {
  const m = D.manifest;
  return `<div class="card"><h2>Manifest</h2>${kv({ "Generated": esc(m.generatedAt), "Commit": esc(m.gitHead), "Node": esc(m.node), "Agent": esc(m.labels.agentMode), "Payments": esc(m.labels.payments), "Live model verified": m.labels.liveModelVerified ? "yes" : "<strong>no</strong>", "Redaction": esc(m.redaction) })}
    <table><thead><tr><th>File</th><th>SHA-256</th></tr></thead><tbody>${m.files.map((f) => `<tr><td>${esc(f.file)}</td><td><code>${esc(f.sha256)}</code></td></tr>`).join("")}</tbody></table></div>`;
}
const TABS = [["Successful payment", success], ["Rejected malicious invoice", malicious], ["Evaluation (deterministic)", () => evalPanel(D.evalMock, "Evaluation: deterministic / MOCK")], ["Evaluation (real model)", () => evalPanel(D.evalLive, "Evaluation: real model")], ["Manifest", manifestPanel]];
$("#badges").innerHTML = '<span class="b-violet">REPLAY: offline record</span><span class="b-amber">AGENT: MOCK</span><span class="b-ink">PAYMENTS: SIMULATED</span><span class="b-amber">LIVE MODEL: NOT VERIFIED</span>';
const tabs = $("#tabs"), panels = $("#panels");
TABS.forEach(([name, fn], i) => {
  const b = document.createElement("button"); b.role = "tab"; b.textContent = name; b.id = "t" + i; b.setAttribute("aria-controls", "p" + i); tabs.append(b);
  const s = document.createElement("section"); s.id = "p" + i; s.role = "tabpanel"; s.setAttribute("aria-labelledby", "t" + i); s.innerHTML = fn(); panels.append(s);
  b.onclick = () => select(i);
});
function select(i) { [...tabs.children].forEach((b, j) => { b.setAttribute("aria-selected", String(i === j)); panels.children[j].hidden = i !== j; }); }
select(0);
</script>
